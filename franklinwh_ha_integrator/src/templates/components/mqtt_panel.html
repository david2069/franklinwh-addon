<!-- mqtt-panel.html - embeddable component -->
<!-- Modal Wrapper -->
<template x-if="$store.app.showMqttExplorer">
<div class="modal-backdrop" @click.self="$store.app.showMqttExplorer = false">
  <div class="modal card" style="max-width:1100px;width:100%;display:flex;flex-direction:column;background:var(--surface-0);border:1px solid var(--border-color);box-shadow:0 12px 32px var(--shadow-color)">
    
    <div x-data="{
            ws: null,
            topics: {},
            selected: null,
            selectedMessages: [],
            expandedPaths: new Set(),
            searchQuery: '',
            connectionState: 'Connecting...',
            hostString: '',
            
            init() {
                // Resolve against the current page rather than pasting a path
                // onto window.location.host: host carries no trailing slash, so
                // the result ran the port straight into the path, and a bare
                // host drops the ingress prefix, aiming the socket at Home
                // Assistant itself instead of at this add-on. new URL() keeps
                // the prefix and inserts the separator, as a relative fetch
                // would. Note this whole block lives inside a double-quoted
                // x-data attribute, so it must never contain a double quote.
                const url = new URL('api/ws/mqtt', window.location.href);
                url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
                this.hostString = url.host;
                this.ws = new WebSocket(url.href);
                
                this.ws.onopen = () => {
                    this.connectionState = 'Connected';
                    // Auto-subscribe to all traffic to populate the tree seamlessly
                    this.subscribe('#');
                    // Expand root namespaces by default
                    this.expandedPaths.add('franklinwh');
                    this.expandedPaths.add('homeassistant');
                    this.expandedPaths.add('$SYS');
                };

                this.ws.onclose = (ev) => {
                    // A bare 'Disconnected' cannot be acted on. The close code
                    // separates the three ways this fails: 1008 is our own auth
                    // check refusing the handshake (the session cookie did not
                    // survive the ingress hop), 1006 means the socket never
                    // opened at all (nothing proxied the upgrade), and a clean
                    // close means the broker bridge stopped.
                    if (ev && ev.code === 1008) {
                        this.connectionState = 'Not authorised';
                    } else if (ev && ev.code === 1006) {
                        this.connectionState = 'Could not reach add-on';
                    } else if (ev && ev.reason) {
                        // The server now sends a reason for every deliberate
                        // close. Showing it beats a bare code.
                        this.connectionState = ev.reason;
                    } else if (ev && ev.code && ev.code !== 1000) {
                        this.connectionState = 'Disconnected (' + ev.code + ')';
                    } else {
                        this.connectionState = 'Disconnected';
                    }
                };
                
                this.ws.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    if (d.type === 'message') {
                        if (!this.topics[d.topic]) {
                            this.topics[d.topic] = [];
                        }
                        this.topics[d.topic].unshift(d);
                        // retain last 20 strictly for memory health
                        this.topics[d.topic] = this.topics[d.topic].slice(0, 20);
                        
                        // force Alpine reactivity
                        this.topics = Object.assign({}, this.topics);
                        if (this.selected === d.topic) {
                            this.selectTopic(this.selected);
                        }
                    }
                };
            },
            
            close() {
                if (this.ws) {
                    this.ws.close();
                }
            },
            
            subscribe(t) { 
                if(!this.ws || this.ws.readyState !== 1) return;
                this.ws.send(JSON.stringify({action:'subscribe',topic:t})); 
            },

            selectTopic(t) {
                this.selected = t;
                this.selectedMessages = this.topics[t] || [];
            },

            togglePath(path) {
                if(this.expandedPaths.has(path)) {
                    this.expandedPaths.delete(path);
                } else {
                    this.expandedPaths.add(path);
                }
                // Force reactivity trigger
                this.expandedPaths = new Set(this.expandedPaths);
            },

            get flattenedTree() {
                const root = {};
                for (const path of Object.keys(this.topics)) {
                    if (this.searchQuery && !path.includes(this.searchQuery)) continue;
                    const parts = path.split('/');
                    let current = root;
                    for (let i = 0; i < parts.length; i++) {
                        const p = parts[i];
                        if (!current[p]) {
                            current[p] = { __children: {}, __path: parts.slice(0, i+1).join('/'), __count: 0, __msgCount: 0 };
                        }
                        if (i === parts.length - 1) {
                            current[p].__msgCount = this.topics[path].length;
                        }
                        current[p].__count += 1;
                        current = current[p].__children;
                    }
                }
                
                const flat = [];
                const dfs = (node, depth) => {
                    for (const key of Object.keys(node).filter(k => !k.startsWith('__')).sort()) {
                        const childNode = node[key];
                        const childrenKeys = Object.keys(childNode.__children).filter(k => !k.startsWith('__'));
                        const hasChildren = childrenKeys.length > 0;
                        const expanded = this.expandedPaths.has(childNode.__path);
                        
                        flat.push({
                            key,
                            path: childNode.__path,
                            depth,
                            hasChildren,
                            expanded,
                            msgCount: childNode.__msgCount,
                            childrenDescendantCount: childNode.__count
                        });
                        
                        if (hasChildren && (expanded || this.searchQuery)) {
                            dfs(childNode.__children, depth + 1);
                        }
                    }
                };
                dfs(root, 0);
                return flat;
            },

            formatPayload(payload) {
                try {
                   return JSON.stringify(JSON.parse(payload), null, 2);
                } catch(e) {
                   return payload;
                }
            }
        }" style="display:flex;flex-direction:column;height:70vh;min-height:600px" x-init="$watch('$store.app.showMqttExplorer', val => !val && close())">
        
    <div class="modal-header" style="background:var(--surface-0);color:var(--text-primary);padding:12px 20px;border-bottom:1px solid var(--border-color)">
      <div style="display:flex;align-items:center;gap:16px;width:100%">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#network"/></svg>
        <h2 style="font-size:1.2rem;font-weight:600;margin:0;flex:1">MQTT Explorer</h2>
        
        <div style="display:flex;align-items:center;gap:8px;font-size:0.8rem;background:var(--surface-1);border:1px solid var(--border-color);padding:4px 12px;border-radius:16px">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#circle"/></svg>
            <span x-text="connectionState" style="font-weight:600"></span>
            <span style="opacity:0.7;margin-left:4px" x-text="hostString"></span>
        </div>

        <button class="icon-btn" @click="$store.app.showMqttExplorer = false" style="color:var(--text-secondary);font-size:1.2rem"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#x"/></svg></button>
      </div>
    </div>

    <!-- Payload body per user verbatim, integrated into HA UI schema -->
    <div class="modal-body" style="padding:0;display:flex;flex-direction:row;flex:1;overflow:hidden;background:var(--surface-0);color:var(--text-primary)">
            
            <!-- Side nav: Topic Tree list -->
            <div style="width:340px;min-width:260px;max-width:60%;border-right:1px solid var(--border-color);display:flex;flex-direction:column;background:var(--surface-background);resize:horizontal;overflow:hidden">
                <div style="padding:12px;border-bottom:1px solid var(--border-color);display:flex;gap:6px;background:var(--surface-0)">
                    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#search"/></svg>
                    <input type="text" placeholder="Search topics..." x-model="searchQuery" style="flex:1;background:var(--surface-background);border:1px solid var(--border-color);color:var(--text-primary);padding:6px 10px;border-radius:4px;font-size:0.8rem">
                    <button @click="subscribe(searchQuery || '#')" style="background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border-color);border-radius:4px;padding:0 10px;cursor:pointer"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#arrow-right"/></svg></button>
                </div>
                <!-- Topics list -->
                <div style="flex:1;overflow-y:auto;padding:8px">
                  <template x-for="item in flattenedTree" :key="item.path">
                     <div style="padding:4px;border-radius:4px;cursor:pointer;font-size:0.8rem;display:flex;align-items:center;gap:6px;user-select:none"
                          :style="`${selected === item.path ? 'background:var(--surface-active);color:var(--text-primary);' : 'color:var(--text-primary);'} margin-left: ${item.depth * 14}px`"
                          @click.stop="item.hasChildren ? togglePath(item.path) : selectTopic(item.path)"
                          @dblclick="selectTopic(item.path)">
                          
                          <!-- Tree Caret -->
                          <div style="width:16px;text-align:center;color:var(--text-muted)" @click.stop="togglePath(item.path)">
                              <template x-if="item.hasChildren">
                                  <i class="fas" :class="item.expanded ? 'fa-caret-down' : 'fa-caret-right'" :style="selected === item.path ? 'color:var(--text-primary)' : ''"></i>
                              </template>
                          </div>

                          <span x-text="item.key" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" :style="selected === item.path ? 'font-weight:700' : 'font-weight:600'"></span>
                          
                          <!-- Metadata counts -->
                          <div style="margin-left:auto;display:flex;gap:4px;font-size:0.65rem">
                              <span x-show="item.msgCount > 0" style="background:var(--surface-active);color:var(--text-primary);padding:1px 6px;border-radius:8px" x-text="`${item.msgCount} msg`"></span>
                              <span x-show="item.hasChildren && !item.expanded" style="background:var(--border-color);color:var(--text-secondary);padding:1px 6px;border-radius:8px" x-text="`${item.childrenDescendantCount} sub`"></span>
                          </div>
                     </div>
                  </template>
                  <div x-show="flattenedTree.length === 0" style="padding:12px;text-align:center;color:var(--text-muted);font-size:0.8rem;margin-top:20px">
                      <svg class="icon fa-spin" aria-hidden="true" viewBox="0 0 24 24"><use href="#help-circle"/></svg><br>
                      Awaiting telemetry...
                  </div>
                </div>
            </div>

            <!-- Inspect Main Pane -->
            <div style="flex:1;display:flex;flex-direction:column;background:var(--surface-0);overflow:hidden">
                <div style="padding:12px 16px;background:var(--surface-background);border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center">
                    <div style="font-family:monospace;font-size:0.85rem;color:var(--text-primary);font-weight:700" x-text="selected || 'Topic selection'"></div>
                </div>
                
                <div style="flex:1;overflow-y:auto;padding:16px" x-show="selected">
                    <template x-for="(msg, index) in selectedMessages" :key="index">
                        <div style="margin-bottom:16px;background:var(--surface-0);border-radius:6px;border:1px solid var(--border-color);overflow:hidden">
                            <div style="background:var(--surface-background);padding:6px 12px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-primary);font-weight:700">
                                <span style="display:flex;align-items:center;">Payload <span x-show="msg.retain" style="color:var(--live);margin-left:8px;background:var(--surface-1);border:1px solid var(--live);padding:1px 6px;border-radius:4px;font-size:0.6rem">RETAINED</span></span>
                                <span x-text="new Date(msg.timestamp * 1000).toLocaleTimeString()"></span>
                            </div>
                            <pre style="margin:0;padding:12px;font-size:0.8rem;color:var(--text-primary);white-space:pre-wrap;word-break:break-all;font-family:monospace" x-text="formatPayload(msg.payload)"></pre>
                        </div>
                    </template>
                </div>
                
                <div x-show="!selected" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.9rem">
                    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#search"/></svg>
                    Select a topic on the left to inspect its payloads.
                </div>
            </div>

        </div>
    </div>
</div>
</template>
