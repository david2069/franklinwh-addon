  ═══════════════════════════════════════════════════════════════════════ -->
  
  <!-- Loading / Error (inside prices sub-tab) -->
  <template x-if="loading">
    <div class="card flex items-center justify-center gap-3 py-20" style="color:var(--text-muted)">
      <svg class="icon fa-spin" aria-hidden="true" viewBox="0 0 24 24"><use href="#loader"/></svg> Connecting to Amber…
    </div>
  </template>
  <template x-if="!loading && error">
    <div class="card p-5 text-sm" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#ef4444" x-text="error"></div>
  </template>
  
  <template x-if="!loading && !error && !livePrice">
    <div class="card flex flex-col items-center justify-center gap-4 py-24 text-center">
      <div class="w-16 h-16 rounded-full bg-gray-800/50 flex items-center justify-center text-gray-500 mb-2">
        <i class="fa-solid fa-bolt text-2xl"></i>
      </div>
      <h3 class="text-lg font-semibold text-gray-300">Amber Electric Not Configured</h3>
      <p class="text-sm text-gray-500 max-w-sm">No live pricing data was returned by the gateway. Ensure Amber Electric is configured as your active provider.</p>
    </div>
  </template>

  <!-- ══════════════════════════════════════════════════════════════════════
       SECTION 1 — LIVE PRICE HERO
  ═══════════════════════════════════════════════════════════════════════ -->
  <template x-if="!loading && livePrice">
    <div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5 items-stretch">

        <!-- LEFT: Live price circle card — uses design-system .card (theme-aware bg) -->
        <div class="card p-6 flex flex-col justify-between">

          <div class="text-[10px] font-black uppercase tracking-widest mb-4" style="color:var(--text-muted)">Live Price</div>

          <!-- Circle -->
          <div class="flex flex-col items-center">
            <div class="relative w-44 h-44 rounded-full flex flex-col items-center justify-center shadow-2xl overflow-hidden mb-4"
                 :style="'background:' + livePriceBgColor(livePrice.tariff_type)">

              <!-- Time window -->
              <div class="absolute top-5 text-[9px] font-bold text-black/70 tracking-wider uppercase">
                <span x-text="formatTime(livePrice.valid_until ? new Date(new Date(livePrice.valid_until) - (livePrice.interval_min||5)*60000).toISOString() : new Date().toISOString())"></span>
                -
                <span x-text="formatTime(livePrice.valid_until || new Date().toISOString())"></span>
              </div>

              <!-- Price -->
              <div class="flex items-start gap-0.5">
                <span class="text-5xl font-black text-black leading-none" x-text="Math.round(livePrice.import_c_kwh || 0)"></span>
                <span class="text-2xl font-black text-black/70 mt-1.5">¢</span>
              </div>
              <div class="text-[10px] font-black text-black/60 uppercase tracking-widest">/kWh</div>

              <!-- Renewables badge -->
              <div class="absolute bottom-5 flex items-center gap-1 bg-black/20 backdrop-blur rounded-full px-2.5 py-0.5">
                <i class="fas fa-leaf text-green-300 text-[9px]"></i>
                <span class="text-white font-black text-[9px]" x-text="(livePrice.renewables_pct || 0) + '% renewables'"></span>
              </div>
            </div>

            <!-- Feed-in / Solar badge -->
            <template x-if="feedInPrice !== null">
              <div class="flex items-center gap-2 text-sm" style="color:var(--text-secondary)">
                <i class="fas fa-sun text-yellow-500"></i>
                <span>Solar Feed-in</span>
                <span class="text-xl font-black text-yellow-500" x-text="Math.round((feedInPrice * -1) || 0) + '¢'"></span>
                <span class="text-xs" style="color:var(--text-muted)">/kWh</span>
              </div>
            </template>
          </div>

          <!-- Summary text -->
          <div class="mt-4 rounded-xl p-4 text-sm leading-relaxed"
               style="background:var(--surface-1);border:1px solid var(--border);color:var(--text-secondary)"
               x-text="summary"></div>

          <!-- Status chips -->
          <div class="flex flex-wrap gap-2 mt-3">
            <!-- Spike -->
            <span x-show="livePrice.spike_status && livePrice.spike_status !== 'NONE'"
                  class="text-[10px] font-black px-2.5 py-1 rounded-full animate-pulse"
                  style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.35)"
                  x-text="'⚡ ' + livePrice.spike_status"></span>
            <!-- Demand window chip -->
            <span x-show="livePrice.demand_window"
                  class="text-[10px] font-black px-2.5 py-1 rounded-full"
                  style="background:rgba(168,85,247,.1);color:#a855f7;border:1px solid rgba(168,85,247,.3)">
              DEMAND ACTIVE
            </span>
            <!-- Interval -->
            <span class="text-[10px] font-black px-2.5 py-1 rounded-full"
                  style="background:rgba(59,130,246,.1);color:#3b82f6;border:1px solid rgba(59,130,246,.25)"
                  x-text="(livePrice.interval_min || 30) + '-min window'"></span>
            <!-- Tariff -->
            <span class="text-[10px] font-black px-2.5 py-1 rounded-full"
                  :style="'background:' + livePriceBgColor(livePrice.tariff_type) + '22;color:' + livePriceBgColor(livePrice.tariff_type) + ';border:1px solid ' + livePriceBgColor(livePrice.tariff_type) + '55'"
                  x-text="livePrice.tariff_type"></span>
          </div>

          <!-- Demand Window Prominent Alert -->
          <div x-show="livePrice.demand_window" x-transition
               class="mt-3 rounded-xl p-3.5"
               style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3)">
            <div class="flex items-start gap-2.5">
              <i class="fas fa-bolt text-[14px] mt-0.5 flex-shrink-0" style="color:#a855f7"></i>
              <div>
                <p class="text-[11px] font-black uppercase tracking-widest mb-1" style="color:#c084fc">⚡ Demand Window Active</p>
                <p class="text-[11px] leading-snug" style="color:#d8b4fe">Your peak demand is being measured right now. Avoid high-load appliances to minimise your demand charge.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT: Usage last 30 days summary card -->
        <div class="card p-6 flex flex-col">
          <div class="text-[10px] font-black uppercase tracking-widest mb-3" style="color:var(--text-muted)">Usage — Last 30 Days</div>

          <!-- Usage bar chart -->
          <div class="flex-1 min-h-[180px] relative">
            <canvas id="amber-usage-chart"></canvas>
          </div>

          <!-- Period KPI row — shows totals for the LOADED date range -->
          <template x-if="periodKpis">
            <div>
              <div class="text-[9px] font-black uppercase tracking-widest mt-3 mb-2" style="color:var(--text-muted)" x-text="periodKpis.label + ' — Summary'"></div>
              <div class="grid grid-cols-3 gap-2 pt-3" style="border-top:1px solid var(--border)">
                <div>
                  <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:#3b82f6">Usage Cost</div>
                  <div class="text-xl font-black" style="color:var(--text-primary)">$<span x-text="periodKpis.cost"></span></div>
                </div>
                <div>
                  <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:#3b82f6">Total Usage</div>
                  <div class="text-xl font-black" style="color:var(--text-primary)"><span x-text="periodKpis.kwh"></span><span class="text-sm ml-1" style="color:var(--text-muted)">kWh</span></div>
                </div>
                <div>
                  <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:#22c55e">% Renewables</div>
                  <div class="text-xl font-black" style="color:var(--text-primary)">
                    <span x-text="periodKpis.renewables !== null ? periodKpis.renewables + '%' : '—'"></span>
                    <span x-show="periodKpis.renewables !== null && periodKpis.renewables > 30"
                          class="ml-1 text-[9px] font-black px-1.5 py-0.5 rounded"
                          style="background:rgba(34,197,94,.12);color:#16a34a">🌱 grid</span>
                  </div>
                </div>
              </div>
              <!-- Solar exports row (if present) -->
              <template x-if="parseFloat(periodKpis.export_kwh) > 0">
                <div class="mt-2 pt-2 flex items-center gap-6" style="border-top:1px solid var(--border)">
                  <div>
                    <div class="text-[9px] font-black uppercase tracking-widest mb-0.5" style="color:#d97706">Solar Exports</div>
                    <div class="text-base font-black" style="color:var(--text-primary)"><span x-text="periodKpis.export_kwh"></span><span class="text-xs ml-1" style="color:var(--text-muted)">kWh</span></div>
                  </div>
                  <div x-show="parseFloat(periodKpis.export_cost) < 0">
                    <div class="text-[9px] font-black uppercase tracking-widest mb-0.5" style="color:#16a34a">Earned</div>
                    <div class="text-base font-black" style="color:#16a34a" x-text="'-$' + Math.abs(parseFloat(periodKpis.export_cost)).toFixed(2)"></div>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Legend -->
          <div class="flex items-center gap-4 mt-3 text-[10px]" style="color:var(--text-muted)">
            <span class="flex items-center gap-1.5"><span class="w-3 h-2 rounded-sm inline-block" style="background:rgba(245,158,11,0.7)"></span>Solar Exports</span>
          </div>
        </div>
      </div>

      <!-- ══════════════════════════════════════════════════════════════════
           SECTION 2 — PRICE WINDOW STRIP (accordion 30-min → 5-min)
      ═══════════════════════════════════════════════════════════════════ -->
      <div class="card p-0 overflow-hidden mb-5">
        <!-- Strip header with Import/Export toggle -->
        <div class="flex items-center justify-between px-4 py-3" style="border-bottom:1px solid var(--border)">
            <div class="flex items-center gap-2">
              <div class="w-10 h-10 rounded-full border-2 border-indigo-500 bg-indigo-500/15 flex items-center justify-center shadow-md shadow-indigo-500/20">
                <i class="fa-solid fa-right-left text-xs text-indigo-400"></i>
              </div>
              <div class="ml-1">
                <div class="font-bold text-sm" style="color:var(--text-primary)">30-Min Forecast &mdash; Buy &amp; Sell</div>
                <div class="text-[9px] text-gray-500 uppercase tracking-widest font-bold">Dual-Channel Price Strip</div>
              </div>
            </div>
          <div class="text-[10px]" style="color:var(--text-muted)">Click a window to see 5-min intervals · Scroll → for future</div>
        </div>

        <!-- 30-min window strip (accordion) -->
        <div id="amber-price-strip" class="overflow-x-auto px-4 py-3" style="scrollbar-width:thin">
          <div class="flex gap-1.5 min-w-max" id="amber-strip-inner">
            <template x-for="win in priceWindows" :key="win.idx">
              <div class="flex flex-col" :id="win.is_current ? 'amber-strip-current' : ''">

                <!-- 30-min header cell -->
                <div @click="win.intervals.length ? toggleWindow(win.idx) : null"
                     class="flex flex-col items-center text-center px-2.5 py-2 rounded-xl min-w-[72px] transition-all duration-150 select-none"
                     :class="win.intervals.length ? 'cursor-pointer' : 'cursor-default'"
                     :style="expandedWindows.includes(win.idx)
                       ? 'background:' + livePriceBgColor(win.tariff_type) + '18;outline:1px solid ' + livePriceBgColor(win.tariff_type) + '55'
                       : (win.is_current
                           ? 'background:var(--surface-2);outline:2px solid rgba(74,222,128,.6)'
                           : (win.is_past ? 'background:var(--surface-0);opacity:0.55' : 'background:var(--surface-0)'))">
                  <!-- Time window label hh:mm -->
                  <div class="text-[9px] font-mono mb-1" style="color:var(--text-muted)">
                    <span x-text="formatTime(win.start_time)"></span>
                  </div>
                  <!-- Color dot — empty slot shows dashed circle -->
                  <template x-if="win.avg_import !== null">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm mb-0.5"
                         :style="'background:' + windowColor(win) + '33;color:' + windowColor(win)">
                      <span x-text="spikeIcon({tariff_type: win.tariff_type})"></span>
                    </div>
                  </template>
                  <template x-if="win.avg_import === null">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm mb-0.5"
                         style="border:1.5px dashed var(--border)">·</div>
                  </template>
                  <!-- Stacked Buy / Sell Averages -->
                  <div class="flex flex-col items-center gap-0.5 mt-0.5">
                    <div class="text-[10px] font-black flex items-center gap-0.5" style="color:#f87171" title="Buy / Import Price">
                      <i class="fa-solid fa-arrow-down text-[7px]"></i>
                      <span x-text="win.avg_import !== null ? Math.round(win.avg_import) + '¢' : '—'"></span>
                    </div>
                    <div class="text-[10px] font-black flex items-center gap-0.5" style="color:#facc15" title="Sell / Export Price">
                      <i class="fa-solid fa-arrow-up text-[7px]"></i>
                      <span x-text="win.avg_export !== null ? Math.round(win.avg_export) + '¢' : '—'"></span>
                    </div>
                  </div>
                  <!-- Renewables -->
                  <div class="text-[9px]" style="color:var(--text-muted)" x-text="win.renewables !== null ? win.renewables + '%' : ''"></div>
                  <!-- Demand window stripe: purple bar at bottom of cell -->
                  <div x-show="win.has_demand_window"
                       class="w-full mt-1 rounded-full"
                       style="height:3px;background:rgba(168,85,247,.7)"
                       title="Demand tariff window active"></div>
                  <!-- Period label badge (spike / solarSponge / force-charge signal) -->
                  <template x-if="periodLabel(win)">
                    <div class="text-[7px] font-black px-1 py-0.5 rounded mt-0.5 text-center leading-tight"
                         :style="'background:' + windowColor(win) + '22;color:' + windowColor(win)"
                         x-text="periodLabel(win)"></div>
                  </template>
                  <!-- Expand chevron — only when intervals exist -->
                  <div class="text-[8px] mt-0.5" style="color:var(--text-muted)"
                       x-show="win.intervals.length > 0"
                       x-text="expandedWindows.includes(win.idx) ? '▲' : '▼'"></div>
                </div>

                <!-- 5-min expanded sub-row -->
                <div x-show="expandedWindows.includes(win.idx)"
                     x-transition:enter="transition-all duration-150"
                     x-transition:enter-start="opacity-0 scale-y-95"
                     x-transition:enter-end="opacity-100 scale-y-100"
                     class="flex gap-0.5 mt-1 px-0.5 py-1.5 rounded-lg"
                     style="background:var(--surface-1);border:1px solid var(--border)">
                  <template x-for="item in win.intervals" :key="item.start_time">
                    <div class="flex flex-col items-center text-center px-1 py-1 rounded min-w-[52px]"
                         :style="item.is_current ? 'background:rgba(34,197,94,.08)' : ''">
                      <div class="text-[8px] font-mono mb-0.5" style="color:var(--text-muted)" x-text="formatTime(item.start_time)"></div>
                      <div class="w-5 h-5 rounded-full flex items-center justify-center text-xs mb-0.5"
                           :style="'background:' + livePriceBgColor(item.tariff_type) + '30;color:' + livePriceBgColor(item.tariff_type)">
                        <span x-text="spikeIcon(item)"></span>
                      </div>
                      <div class="flex flex-col items-center gap-0.5 text-[9px]">
                        <span class="font-black" style="color:#f87171" x-text="item.import_c !== null ? Math.round(item.import_c) + '¢' : '—'"></span>
                        <span class="font-black" style="color:#facc15" x-text="item.export_c !== null ? Math.round(item.export_c) + '¢' : '—'"></span>
                      </div>
                      <div class="text-[8px]" style="color:var(--text-muted)" x-text="item.renewables !== null ? item.renewables + '%' : ''"></div>
                      <!-- Spike badge -->
                      <span x-show="item.spike_status && item.spike_status !== 'none'"
                            class="text-[7px] font-black px-1 py-0.5 rounded mt-0.5"
                            style="background:rgba(239,68,68,.15);color:#ef4444"
                            x-text="item.spike_status === 'spike' ? '⚡SPIKE' : '⚠?'"></span>
                      <!-- Solar Sponge badge -->
                      <span x-show="item.tariff_period === 'solarSponge'"
                            class="text-[7px] font-black px-1 py-0.5 rounded mt-0.5"
                            style="background:rgba(245,158,11,.15);color:#f59e0b">&#x2600; EXPORT</span>
                    </div>
                  </template>
                </div>

              </div>
            </template>
          </div>
        </div>

        <!-- Strip footer: spot price if available -->
        <template x-if="livePrice.spot_c_kwh !== null && livePrice.spot_c_kwh !== undefined">
          <div class="px-4 py-2 text-[10px]" style="border-top:1px solid var(--border);color:var(--text-muted)">
            NEM Spot: <span class="font-mono" style="color:#3b82f6" x-text="(livePrice.spot_c_kwh || 0).toFixed(2) + '¢/kWh'"></span>
          </div>
        </template>
      </div>

      <!-- ══════════════════════════════════════════════════════════════════
           SECTION 3 — USAGE & BILLING HISTORY
      ═══════════════════════════════════════════════════════════════════ -->
      <div class="card p-0 overflow-hidden mb-5">
        <!-- Section header -->
        <div class="flex items-center justify-between px-5 py-4" style="border-bottom:1px solid var(--border);background:var(--glass-bg)">
          <div>
            <div class="font-bold text-base flex items-center gap-2" style="color:var(--text-primary)">
              <i class="fas fa-receipt text-sm" style="color:#3b82f6"></i> Usage &amp; Billing History
            </div>
            <div class="text-[10px] mt-0.5" style="color:var(--text-muted)">kWh consumed &amp; solar exported per interval — powered by Amber API</div>
          </div>
          <!-- Date range selector -->
          <div class="flex items-center gap-1.5 rounded-xl p-1" style="background:var(--surface-1);border:1px solid var(--border)">
            <template x-for="r in ['today','7d','30d']" :key="r">
              <button @click="changeRange(r)"
                      class="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-all"
                      :style="usageRange === r ? 'background:#2563eb;color:#fff;box-shadow:0 1px 4px rgba(37,99,235,.4)' : 'color:var(--text-muted)'">
                <span x-text="r === 'today' ? 'Today' : r"></span>
              </button>
            </template>
          </div>
        </div>

        <div class="p-5">
          <!-- Loading spinner -->
          <template x-if="loadingUsage">
            <div class="flex items-center justify-center py-10 gap-2 text-sm" style="color:var(--text-muted)">
              <svg class="icon fa-spin" aria-hidden="true" viewBox="0 0 24 24"><use href="#loader"/></svg> Loading usage data…
            </div>
          </template>

          <template x-if="!loadingUsage && usageData">
            <div>

              <!-- Day detail (auto-selected or clicked from chart) -->
              <template x-if="selectedDay">
                <div class="mb-5">
                  <!-- Day header -->
                  <div class="font-bold text-sm mb-3" style="color:var(--text-secondary)" x-text="formatDay(selectedDay)"></div>

                  <!-- Day KPI row -->
                  <template x-if="dayKpis">
                    <div class="flex flex-wrap gap-3 mb-4">
                      <div class="rounded-xl px-4 py-3" style="background:var(--surface-1);border:1px solid var(--border)">
                        <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:var(--text-muted)">Usage Cost</div>
                        <div class="text-xl font-black" style="color:var(--text-primary)">$<span x-text="dayKpis.cost"></span></div>
                      </div>
                      <div class="rounded-xl px-4 py-3" style="background:var(--surface-1);border:1px solid var(--border)">
                        <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:#3b82f6">% Renewables</div>
                        <div class="text-xl font-black" style="color:var(--text-primary)" x-text="dayKpis.renewables !== null ? dayKpis.renewables + '%' : '—'"></div>
                      </div>
                      <div class="rounded-xl px-4 py-3" style="background:var(--surface-1);border:1px solid var(--border)">
                        <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:var(--text-muted)">Total Usage</div>
                        <div class="text-xl font-black" style="color:var(--text-primary)"><span x-text="dayKpis.kwh"></span><span class="text-xs ml-1" style="color:var(--text-muted)">kWh</span></div>
                      </div>
                      <template x-if="parseFloat(dayKpis.export_kwh) > 0">
                        <div class="rounded-xl px-4 py-3" style="background:var(--surface-1);border:1px solid var(--border)">
                          <div class="text-[9px] font-black uppercase tracking-widest mb-1" style="color:#d97706">Solar Exports</div>
                          <div class="text-xl font-black" style="color:var(--text-primary)">
                            <span x-text="dayKpis.export_kwh"></span><span class="text-xs ml-1" style="color:var(--text-muted)">kWh</span>
                            <span x-show="parseFloat(dayKpis.export_cost) < 0"
                                  class="ml-2 text-[10px] font-black px-2 py-0.5 rounded-full"
                                  style="background:rgba(34,197,94,.12);color:#16a34a"
                                  x-text="'-$' + Math.abs(parseFloat(dayKpis.export_cost)).toFixed(2) + ' earned'"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Channel detail table -->
                  <template x-if="usageData.general && usageData.general.filter(r => r.start_time.startsWith(selectedDay)).length > 0">
                    <div class="mb-4 rounded-xl overflow-hidden" style="border:1px solid var(--border)">
                      <div class="px-4 py-2 flex items-center justify-between" style="background:var(--surface-1);border-bottom:1px solid var(--border)">
                        <span class="text-[10px] font-black uppercase tracking-widest" style="color:var(--text-muted)">Base Interval Detail — Channel Identifiers</span>
                        <span class="text-[9px]" style="color:var(--text-muted)">30-min intervals</span>
                      </div>
                      <div class="overflow-x-auto">
                        <table class="w-full text-[10px]" style="color:var(--text-secondary)">
                          <thead>
                            <tr style="border-bottom:1px solid var(--border)">
                              <th class="text-left px-3 py-1.5 font-black uppercase tracking-wider" style="color:var(--text-muted)">Time</th>
                              <th class="text-left px-3 py-1.5 font-black uppercase tracking-wider" style="color:var(--text-muted)">Channel</th>
                              <th class="text-right px-3 py-1.5 font-black uppercase tracking-wider" style="color:var(--text-muted)">kWh</th>
                              <th class="text-right px-3 py-1.5 font-black uppercase tracking-wider" style="color:var(--text-muted)">Cost</th>
                              <th class="text-left px-3 py-1.5 font-black uppercase tracking-wider" style="color:var(--text-muted)">Tariff</th>
                              <th class="text-left px-3 py-1.5 font-black uppercase tracking-wider" style="color:var(--text-muted)">Quality</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-for="row in usageData.general.filter(r => r.start_time.startsWith(selectedDay)).slice(0,48)" :key="row.start_time">
                              <tr style="border-bottom:1px solid var(--border)">
                                <td class="px-3 py-1 font-mono" x-text="row.start_time.slice(11,16)"></td>
                                <td class="px-3 py-1">
                                  <span class="px-1.5 py-0.5 rounded text-[9px] font-black"
                                        style="background:rgba(59,130,246,.12);color:#2563eb;border:1px solid rgba(59,130,246,.25)"
                                        x-text="row.channel_identifier || 'E1'"></span>
                                </td>
                                <td class="px-3 py-1 text-right font-mono" x-text="(row.kwh || 0).toFixed(3)"></td>
                                <td class="px-3 py-1 text-right font-mono"
                                    :style="row.cost < 0 ? 'color:#16a34a' : 'color:var(--text-primary)'"
                                    x-text="'$' + (row.cost || 0).toFixed(4)"></td>
                                <td class="px-3 py-1">
                                  <span class="text-[9px] font-black"
                                        :style="'color:' + livePriceBgColor(row.tariff_type)"
                                        x-text="row.tariff_type"></span>
                                </td>
                                <td class="px-3 py-1" style="color:var(--text-muted)" x-text="row.quality || '—'"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                      <!-- Feed-in rows if present -->
                      <template x-if="usageData.feed_in && usageData.feed_in.filter(r => r.start_time.startsWith(selectedDay)).length > 0">
                        <div style="border-top:1px solid var(--border);background:rgba(245,158,11,.04)">
                          <div class="px-4 py-1.5 text-[9px] font-black uppercase tracking-widest" style="color:#d97706">Feed-in (Solar Export)</div>
                          <div class="overflow-x-auto">
                            <table class="w-full text-[10px]" style="color:var(--text-secondary)">
                              <tbody>
                                <template x-for="row in usageData.feed_in.filter(r => r.start_time.startsWith(selectedDay)).slice(0,24)" :key="row.start_time">
                                  <tr style="border-bottom:1px solid var(--border)">
                                    <td class="px-3 py-1 font-mono w-16" x-text="row.start_time.slice(11,16)"></td>
                                    <td class="px-3 py-1">
                                      <span class="px-1.5 py-0.5 rounded text-[9px] font-black"
                                            style="background:rgba(245,158,11,.12);color:#d97706;border:1px solid rgba(245,158,11,.3)"
                                            x-text="row.channel_identifier || 'B1'"></span>
                                    </td>
                                    <td class="px-3 py-1 text-right font-mono" style="color:#d97706" x-text="(row.kwh || 0).toFixed(3)"></td>
                                    <td class="px-3 py-1 text-right font-mono" style="color:#16a34a" x-text="'$' + Math.abs(row.cost || 0).toFixed(4) + ' earned'"></td>
                                    <td class="px-3 py-1 text-[9px] font-black" style="color:#d97706" x-text="row.tariff_type"></td>
                                    <td class="px-3 py-1" style="color:var(--text-muted)" x-text="row.quality || '—'"></td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Meter tab selector -->
                  <div class="flex items-center gap-1 mb-4 rounded-xl p-1 w-fit" style="background:var(--surface-1);border:1px solid var(--border)">
                    <template x-for="m in [{id:'all',label:'All Meters'},{id:'general',label:'General'},{id:'solar',label:'Solar'}]" :key="m.id">
                      <button @click="selectedMeter = m.id"
                              class="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-all"
                              :style="selectedMeter === m.id ? 'background:var(--surface-2);color:var(--text-primary)' : 'color:var(--text-muted)'"
                              x-text="m.label"></button>
                    </template>
                  </div>

                  <!-- Sub-charts row -->
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <div class="text-[10px] font-black uppercase tracking-widest mb-2" style="color:var(--text-muted)">Usage — kWh/30mins</div>
                      <div class="h-40 relative">
                        <canvas id="amber-sub-chart"></canvas>
                      </div>
                    </div>
                    <div>
                      <div class="text-[10px] font-black uppercase tracking-widest mb-2" style="color:var(--text-muted)">Price History — ¢/kWh</div>
                      <div class="h-40 relative">
                        <canvas id="amber-price-hist-chart"></canvas>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Prompt to click a bar -->
              <template x-if="!selectedDay && usageData">
                <div class="text-center py-8 text-sm" style="color:var(--text-muted)">
                  <i class="fas fa-hand-pointer text-2xl block mb-2" style="color:var(--surface-2)"></i>
                  Click a bar in the chart above to see day detail
                </div>
              </template>

            </div>
          </template>

        </div>
      </div>

      <!-- ══════════════════════════════════════════════════════════════════
           SECTION 4 — RAW API RESPONSE DEBUG PANEL (expandable)
      ═══════════════════════════════════════════════════════════════════ -->
      <div class="card p-0 overflow-hidden">
        <!-- Toggle header -->
        <button @click="showRawPanel = !showRawPanel"
                class="w-full flex items-center justify-between px-5 py-3.5 transition text-left"
                style="background:var(--glass-bg);border-bottom:1px solid var(--border)">
          <span class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2" style="color:var(--text-muted)">
            <i class="fas fa-code text-[9px]" style="color:#8b5cf6"></i>Raw Market API Response
          </span>
          <span class="flex items-center gap-2 text-[10px]" style="color:var(--text-muted)">
            <span>Diagnostic — raw JSON from Amber API</span>
            <i class="fas text-[10px]" :class="showRawPanel ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </span>
        </button>

        <!-- Expandable body -->
        <div x-show="showRawPanel" x-transition:enter="transition-all duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             class="p-5">

          <!-- Tab selector -->
          <div class="flex items-center gap-1 mb-4 rounded-xl p-1 w-fit" style="background:var(--surface-1);border:1px solid var(--border)">
            <button @click="rawPanelTab='live'"
                    class="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-all"
                    :style="rawPanelTab==='live' ? 'background:#7c3aed;color:#fff;box-shadow:0 1px 4px rgba(124,58,237,.4)' : 'color:var(--text-muted)'">
              Live Price
            </button>
            <button @click="rawPanelTab='usage'"
                    class="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-all"
                    :style="rawPanelTab==='usage' ? 'background:#7c3aed;color:#fff;box-shadow:0 1px 4px rgba(124,58,237,.4)' : 'color:var(--text-muted)'">
              Usage
            </button>
            <button @click="rawPanelTab='prices'"
                    class="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-all"
                    :style="rawPanelTab==='prices' ? 'background:#7c3aed;color:#fff;box-shadow:0 1px 4px rgba(124,58,237,.4)' : 'color:var(--text-muted)'">
              Prices
            </button>
          </div>

          <!-- JSON display -->
          <div class="rounded-xl overflow-hidden" style="background:#0d1117;border:1px solid rgba(255,255,255,.08)">
            <div class="px-4 py-2 flex items-center justify-between" style="background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06)">
              <span class="text-[9px] font-mono" style="color:rgba(255,255,255,.35)"
                    x-text="rawPanelTab === 'live' ? 'GET /api/pricing/current → data' : (rawPanelTab === 'usage' ? 'GET /api/pricing/amber/usage (first 20 per channel)' : 'GET /api/pricing/amber/prices (first 20 per channel)')"></span>
              <span class="text-[9px]" style="color:rgba(255,255,255,.2)">scroll to explore</span>
            </div>
            <pre class="overflow-auto p-4 text-[10px] font-mono max-h-80 leading-relaxed"
                 style="color:#4ade80"
                 x-text="rawPanelTab === 'live' ? rawLive : (rawPanelTab === 'usage' ? rawUsage : rawPrices)"></pre>
          </div>
        </div>
      </div>

    </div>
  </template>
