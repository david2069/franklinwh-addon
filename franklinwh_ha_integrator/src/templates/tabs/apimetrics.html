<!-- api_metrics v2 — Cloud API latency dashboard -->
<div x-data="apiMetricsTab()" x-init="init()" class="max-w-7xl">

  <!-- Header row -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-black text-gray-100 flex items-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 24 24"><use href="#cloud"/></svg>
        API Metrics
      </h1>
      <p class="text-xs text-gray-400 mt-0.5">Cloud API call latency per gateway</p>
    </div>
    <div class="flex items-center gap-2">
      <select x-model="selectedGw" @change="onGatewayChange()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-blue-500 min-w-48 appearance-none" id="apimetrics-gw-select">
        <option value="" disabled>Select Gateway…</option>
        <template x-for="gw in gateways" :key="gw.short_id">
          <option :value="gw.short_id" x-text="(gw.name || gw.short_id) + ' [' + gw.short_id + ']'"></option>
        </template>
      </select>
      <div class="flex flex-wrap gap-1.5 p-0.5 bg-gray-800/80 rounded-lg border border-gray-700/60">
        <template x-for="val in [1, 7, 30, 0]" :key="val">
          <button @click="metricTimeframe = val; onTimeframeChange()"
                  class="px-3 py-1.5 rounded-md text-[9px] font-black uppercase tracking-wide transition-all duration-150"
                  :class="metricTimeframe === val ? 'bg-blue-600 text-white shadow-sm shadow-blue-900/50 border border-blue-500/60' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-700/50'"
                  x-text="val === 1 ? 'Today' : val === 7 ? '7 Days' : val === 30 ? '30 Days' : 'All Time'"></button>
        </template>
      </div>
      <button class="bg-gray-800 border border-gray-700 hover:bg-gray-700 rounded-lg px-3 py-2 text-xs text-gray-100 transition-colors" @click="load()" id="btn-apimetrics-refresh">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
  </div>

  <!-- No selection -->
  <template x-if="!selectedGw">
    <div class="rounded-xl border border-gray-700 bg-gray-800/80 flex flex-col items-center justify-center gap-3 py-16 text-center text-gray-400 shadow-xl mb-6">
      <i class="fas fa-chart-line text-4xl opacity-30 text-gray-600 mb-2"></i>
      <span class="text-sm font-medium">Select a running gateway to view its live Cloud API telemetry.</span>
    </div>
  </template>

  <!-- Loading -->
  <template x-if="selectedGw && !metrics">
    <div class="rounded-xl border border-gray-700 bg-gray-800/80 flex items-center justify-center gap-3 py-12 text-gray-400 shadow-xl mb-6">
      <i class="fas fa-circle-notch fa-spin"></i> Fetching Live Metrics…
    </div>
  </template>

  <!-- Dashboard -->
  <template x-if="selectedGw && metrics">
    <div class="flex flex-col gap-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">

        <!-- ══ LEFT: Internal API Metrics ══════════════════════════════════ -->
        <div class="rounded-xl border border-blue-500/20 bg-gray-900/30 p-4 flex flex-col gap-4">

          <!-- Section header + pill tabs -->
          <div class="flex items-center justify-between">
            <div class="text-[9px] font-black uppercase tracking-widest text-blue-400/70 flex items-center gap-1.5">
              <i class="fas fa-server text-blue-500/60"></i> Internal API Metrics
            </div>
            <div class="flex gap-1.5 p-0.5 bg-gray-800/80 rounded-lg border border-gray-700/60">
              <button @click="internalTab = 'overview'"
                      id="apimetrics-tab-overview"
                      class="px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wide transition-all duration-150"
                      :class="internalTab === 'overview'
                        ? 'bg-blue-600 text-white shadow-sm shadow-blue-900/50 border border-blue-500/60'
                        : 'text-gray-400 hover:text-gray-200 hover:bg-gray-700/50'">
                Overview
              </button>
              <button @click="internalTab = 'ratelimiter'"
                      id="apimetrics-tab-ratelimiter"
                      class="px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wide transition-all duration-150 flex items-center gap-1.5"
                      :class="internalTab === 'ratelimiter'
                        ? 'bg-purple-600 text-white shadow-sm shadow-purple-900/50 border border-purple-500/60'
                        : 'text-gray-400 hover:text-gray-200 hover:bg-gray-700/50'">
                <span x-show="rl.is_throttled" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse inline-block"></span>
                Rate Limiter
              </button>
            </div>
          </div>

          <!-- ── Overview tab ─────────────────────────────────────────── -->
          <div x-show="internalTab === 'overview'" class="flex flex-col gap-4">

            <!-- KPI: API Calls + Avg Response -->
            <div class="grid grid-cols-2 gap-3">
              <div class="rounded-xl border border-gray-700 bg-gray-800/80 p-4 flex items-center gap-3 shadow-xl">
                <i class="fas fa-bolt text-blue-500 text-2xl"></i>
                <div>
                  <div class="text-2xl font-[100] text-gray-100" x-text="metrics.totals ? metrics.totals.api_calls : 0"></div>
                  <div class="text-[10px] font-black uppercase tracking-widest text-gray-500 mt-1">API Calls</div>
                </div>
              </div>
              <div class="rounded-xl border border-gray-700 bg-gray-800/80 p-4 flex items-center gap-3 shadow-xl">
                <i class="fas fa-clock text-green-500 text-2xl"></i>
                <div>
                  <div class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">Volatile Timing</div>
                  <div class="text-[10px] text-gray-400 leading-tight">Response times reflect active container session only.</div>
                </div>
              </div>
            </div>



          </div><!-- /overview tab -->

          <!-- Session — moved here for left/right visual balance (Option A) -->
          <div x-show="internalTab === 'overview'"
               class="rounded-xl border border-gray-700 bg-gray-800/80 p-4 shadow-xl">
            <div class="text-[10px] font-black uppercase tracking-widest text-gray-400 flex items-center gap-2 mb-3">
              <i class="fas fa-clock text-green-500"></i> Session
            </div>
            <div class="grid grid-cols-2 gap-4 text-xs">
              <div>
                <div class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-1">Uptime</div>
                <div class="font-medium text-gray-200" x-text="getUptimeLabel()"></div>
              </div>
              <div>
                <div class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-1">HTTP Verbs</div>
                <div class="text-gray-400">
                  GET: <span class="text-gray-200" x-text="metrics.methods?.GET || 0"></span>
                  <span class="ml-2">POST:</span> <span class="text-gray-200" x-text="metrics.methods?.POST || 0"></span>
                </div>
              </div>
            </div>
          </div><!-- /session -->

          <!-- ── Rate Limiter tab ──────────────────────────────────────── -->
          <div x-show="internalTab === 'ratelimiter'" class="flex flex-col gap-4">

            <!-- Status badge row -->
            <div class="flex items-center justify-between px-1">
              <span class="text-xs text-gray-400">FHAI self-imposed guard — NOT a FranklinWH cloud server limit</span>
              <div class="flex-shrink-0">
                <span x-show="!rl.is_throttled"
                      class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse inline-block"></span> OK
                </span>
                <span x-show="rl.is_throttled"
                      class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-red-500/15 text-red-400 border border-red-500/30 animate-pulse">
                  <span class="w-1.5 h-1.5 rounded-full bg-red-400 inline-block"></span> THROTTLED
                </span>
              </div>
            </div>

            <!-- 3 explicit rows -->
            <div class="space-y-3">

              <!-- Per-minute -->
              <div>
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="text-gray-400 font-semibold">This minute</span>
                  <div class="flex items-center gap-3">
                    <span class="font-mono"
                          :class="rl.calls_last_minute/(rl.limit_per_minute||1)>0.85?'text-red-400':rl.calls_last_minute/(rl.limit_per_minute||1)>0.60?'text-amber-400':'text-emerald-400'"
                          x-text="rl.calls_last_minute+' / '+(rl.limit_per_minute||'∞')+' ('+(rl.limit_per_minute>0?Math.round(rl.calls_last_minute/rl.limit_per_minute*100):0)+'%)'"></span>
                    <input type="number" x-model.number="rlInputPerMin" min="0"
                           id="apimetrics-rl-input-permin"
                           class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-xs text-gray-100 font-mono w-20 focus:border-purple-500 focus:outline-none"
                           title="Per-minute limit (0 = unlimited)" />
                  </div>
                </div>
                <div class="w-full bg-gray-700/50 rounded-full h-1.5 overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-500"
                       :class="rl.limit_per_minute>0&&rl.calls_last_minute/rl.limit_per_minute>0.85?'bg-red-500':rl.limit_per_minute>0&&rl.calls_last_minute/rl.limit_per_minute>0.60?'bg-amber-500':'bg-emerald-500'"
                       :style="'width:'+(rl.limit_per_minute>0?Math.min(Math.round(rl.calls_last_minute/rl.limit_per_minute*100),100):0)+'%'"></div>
                </div>
              </div>

              <!-- Per-hour -->
              <div>
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="text-gray-400 font-semibold">This hour</span>
                  <div class="flex items-center gap-3">
                    <span class="font-mono"
                          :class="rl.calls_last_hour/(rl.limit_per_hour||1)>0.85?'text-red-400':rl.calls_last_hour/(rl.limit_per_hour||1)>0.60?'text-amber-400':'text-emerald-400'"
                          x-text="rl.calls_last_hour+' / '+(rl.limit_per_hour||'∞')+' ('+(rl.limit_per_hour>0?Math.round(rl.calls_last_hour/rl.limit_per_hour*100):0)+'%)'"></span>
                    <input type="number" x-model.number="rlInputPerHour" min="0"
                           id="apimetrics-rl-input-perhour"
                           class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-xs text-gray-100 font-mono w-20 focus:border-purple-500 focus:outline-none"
                           title="Per-hour limit (0 = unlimited)" />
                  </div>
                </div>
                <div class="w-full bg-gray-700/50 rounded-full h-1.5 overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-500"
                       :class="rl.limit_per_hour>0&&rl.calls_last_hour/rl.limit_per_hour>0.85?'bg-red-500':rl.limit_per_hour>0&&rl.calls_last_hour/rl.limit_per_hour>0.60?'bg-amber-500':'bg-emerald-500'"
                       :style="'width:'+(rl.limit_per_hour>0?Math.min(Math.round(rl.calls_last_hour/rl.limit_per_hour*100),100):0)+'%'"></div>
                </div>
              </div>

              <!-- Daily -->
              <div>
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="text-gray-400 font-semibold">Today</span>
                  <div class="flex items-center gap-3">
                    <span class="font-mono"
                          :class="rl.calls_today/(rl.daily_budget||1)>0.85?'text-red-400':rl.calls_today/(rl.daily_budget||1)>0.60?'text-amber-400':'text-emerald-400'"
                          x-text="rl.calls_today+' / '+(rl.daily_budget||'∞')+' ('+(rl.daily_budget>0?Math.round(rl.calls_today/rl.daily_budget*100):0)+'%)'"></span>
                    <input type="number" x-model.number="rlInputDaily" min="0"
                           id="apimetrics-rl-input-daily"
                           class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-xs text-gray-100 font-mono w-20 focus:border-purple-500 focus:outline-none"
                           title="Daily budget (0 = unlimited)" />
                  </div>
                </div>
                <div class="w-full bg-gray-700/50 rounded-full h-1.5 overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-500"
                       :class="rl.daily_budget>0&&rl.calls_today/rl.daily_budget>0.85?'bg-red-500':rl.daily_budget>0&&rl.calls_today/rl.daily_budget>0.60?'bg-amber-500':'bg-emerald-500'"
                       :style="'width:'+(rl.daily_budget>0?Math.min(Math.round(rl.calls_today/rl.daily_budget*100),100):0)+'%'"></div>
                </div>
              </div>

            </div>

            <!-- Info note -->
            <div class="text-xs text-gray-500 bg-gray-800/50 rounded-lg px-3 py-2 border border-gray-700/50">
              <span class="text-gray-400 font-semibold">ℹ Normal operation</span> with DEFAULT_CACHE + TTL extensions ≈ ~2 API calls per poll cycle.
              At 30s intervals: ~240 calls/hr — well below the default 1500/hr guard.
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3">
              <button @click="applyRateLimits()" :disabled="rlSaving"
                      id="apimetrics-btn-apply-rate-limits"
                      class="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2 px-4 rounded-lg text-xs transition-colors flex items-center gap-2">
                <i class="fas" :class="rlSaving ? 'fa-sync-alt fa-spin' : 'fa-save'"></i>
                <span x-text="rlSaving ? 'Saving…' : 'Apply Limits'"></span>
              </button>
              <button @click="resetRateLimits()"
                      id="apimetrics-btn-reset-rate-limits"
                      class="bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold py-2 px-4 rounded-lg text-xs transition-colors">
                Reset to Defaults
              </button>
              <button @click="loadRateLimits()" class="bg-gray-800 hover:bg-gray-700 text-gray-400 py-2 px-3 rounded-lg text-xs transition-colors ml-auto">
                <i class="fas fa-sync-alt text-xs"></i>
              </button>
            </div>
            <div x-show="rlMsg" class="text-xs font-semibold px-3 py-2 rounded-lg"
                 :class="rlMsg?.ok ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/10 text-red-400 border border-red-500/30'"
                 x-text="rlMsg?.text"></div>

          </div><!-- /ratelimiter tab -->

        </div><!-- /LEFT Internal -->

        <!-- ══ RIGHT: External · CloudFront ════════════════════════════════ -->
        <div class="rounded-xl border border-purple-500/20 bg-gray-900/30 p-4 flex flex-col gap-4">
          <div class="text-[9px] font-black uppercase tracking-widest text-purple-400/70 flex items-center gap-1.5">
            <i class="fas fa-globe text-purple-500/60"></i> External · CloudFront
          </div>

          <!-- 2-card KPI row: Errors + CloudFront PoP -->
          <div class="grid grid-cols-2 gap-3">

            <!-- Errors KPI card -->
            <div class="rounded-xl border border-gray-700 hover:border-red-500/40 bg-gray-800/80 p-4 flex flex-col gap-2 shadow-xl cursor-pointer transition-all group"
                 id="apimetrics-card-errors"
                 @click="openLogsFiltered('ERROR', 'CloudFront', errLinkWindow)"
                 title="Open CloudFront errors in Logs">
              <div class="flex items-center gap-3">
                <i class="fas fa-exclamation-circle text-red-500 text-2xl"></i>
                <div>
                  <div class="text-2xl font-[100]" :class="getTotalErrors() > 0 ? 'text-red-500' : 'text-gray-100'"
                       x-text="getTotalErrors()"></div>
                  <div class="text-[10px] font-black uppercase tracking-widest text-gray-500 mt-0.5">Errors</div>
                </div>
              </div>
              <!-- Time window buttons -->
              <div class="flex gap-1.5" @click.stop>
                <template x-for="w in [0, 24, 168]" :key="w">
                  <button @click="errLinkWindow = w"
                          class="px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-wide transition-all duration-150"
                          :class="errLinkWindow === w
                            ? 'bg-red-600 text-white border border-red-500/60 shadow-sm'
                            : 'bg-gray-700/50 text-gray-500 hover:text-gray-200 hover:bg-gray-700 border border-transparent'"
                          x-text="windowLabel(w)"></button>
                </template>
              </div>
              <div class="text-[9px] text-red-400/50 group-hover:text-red-400/80 transition-colors">↗ open in Logs</div>
            </div>

            <!-- CloudFront PoP KPI card — click opens world map modal -->
            <div class="rounded-xl border border-gray-700 hover:border-blue-500/40 bg-gray-800/80 p-4 flex items-center gap-3 shadow-xl cursor-pointer transition-all group"
                 id="apimetrics-card-cf-pop"
                 @click="openPopMap()"
                 title="Open CloudFront PoP World Map">
              <i class="fas fa-globe text-blue-500 text-2xl group-hover:text-blue-400 transition-colors"></i>
              <div class="flex-1 min-w-0">
                <div class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">CloudFront PoP</div>
                <div class="text-xl font-[100] text-blue-500" x-text="metrics.edge.last_pop || '—'"></div>
              </div>
              <!-- Map affordance: enlarged glowing badge -->
              <div class="flex flex-col items-center gap-1 px-2.5 py-2 rounded-lg
                          bg-blue-500/10 hover:bg-blue-500/20
                          border border-blue-500/30 group-hover:border-blue-400/60
                          ring-1 ring-blue-400/20 group-hover:ring-blue-400/50
                          transition-all duration-200">
                <i class="fas fa-map-marked-alt text-blue-400 group-hover:text-blue-300 text-xl transition-colors"></i>
                <span class="text-[10px] font-black uppercase tracking-wide text-blue-400 group-hover:text-blue-300 transition-colors">Map</span>
              </div>
            </div>

          </div>

          <!-- ══ EDGE DETAIL accordion (CloudFront Edge + Errors & Retries combined) ══ -->
          <div class="rounded-xl border border-gray-700 bg-gray-800/80 shadow-xl overflow-hidden">

            <!-- Always-visible summary header — shows headline KPIs at a glance -->
            <div class="flex items-center justify-between px-5 py-3.5 cursor-pointer
                        hover:bg-gray-700/20 transition-colors select-none"
                 @click="edgeDetailOpen = !edgeDetailOpen">
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                <div class="text-[10px] font-black uppercase tracking-widest text-gray-300 flex items-center gap-1.5">
                  <i class="fas fa-network-wired text-blue-400/70 text-[11px]"></i> Edge Detail
                </div>
                <!-- Inline KPIs (always visible) -->
                <span class="text-[10px] font-mono text-gray-500"
                      x-text="(metrics.edge?.requests || 0).toLocaleString() + ' req'"></span>
                <span class="text-[10px] font-black font-mono text-blue-400"
                      x-text="metrics.edge?.last_pop || '—'"></span>
                <span class="text-[10px] font-mono"
                      :class="getCacheHitPct() > 0 ? 'text-amber-400' : 'text-gray-600'"
                      x-text="getCacheHitPct() + '% cache'"></span>
                <span x-show="getTotalErrors() > 0"
                      class="text-[9px] font-black px-1.5 py-0.5 rounded-full
                             bg-red-500/20 text-red-400 border border-red-500/30"
                      x-text="getTotalErrors() + ' err'"></span>
              </div>
              <i class="fas text-gray-500 text-[11px] flex-shrink-0 ml-3 transition-transform duration-200"
                 :class="edgeDetailOpen ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
            </div>

            <!-- Expandable body -->
            <div x-show="edgeDetailOpen"
                 class="border-t border-gray-700/60 p-5 flex flex-col gap-5"
                 style="transition: all 0.2s ease">

              <!-- CloudFront Edge sub-section -->
              <div>
                <div class="text-[9px] font-black uppercase tracking-widest text-blue-400/70
                            flex items-center gap-1.5 mb-3">
                  <i class="fas fa-globe text-blue-500/60"></i> CloudFront Edge
                </div>
                <div class="space-y-2.5 text-xs">
                  <div class="flex justify-between">
                    <span class="text-gray-400 font-medium tracking-wide">CF Requests</span>
                    <span class="font-medium text-gray-100 bg-gray-700/50 px-2 rounded"
                          x-text="metrics.edge.requests"></span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-gray-400 font-medium tracking-wide">Cache Hit</span>
                    <span class="font-bold px-2 rounded"
                          :class="getCacheHitPct() > 0 ? 'text-amber-500 bg-amber-500/10' : 'text-blue-500 bg-blue-500/10'"
                          x-text="getCacheHitPct() + '%'"></span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-gray-400 font-medium tracking-wide">Transitions</span>
                    <span class="font-medium text-gray-100 bg-gray-700/50 px-2 rounded"
                          x-text="metrics.edge.transitions"></span>
                  </div>
                </div>
                <!-- PoP Distribution -->
                <div class="text-[9px] text-gray-500 mt-4 mb-2 font-black uppercase tracking-widest">PoP Distribution</div>
                <template x-for="[pop, count] in Object.entries(metrics.edge.pop_counts || {}).sort((a,b) => b[1]-a[1])" :key="pop">
                  <div class="flex justify-between text-xs mb-1.5 bg-gray-900/50 px-3 py-1.5 rounded-lg border border-gray-700/50">
                    <span class="font-black tracking-wider text-blue-500" x-text="pop"></span>
                    <span class="text-gray-400 font-mono" x-text="count + ' req'"></span>
                  </div>
                </template>
              </div>

              <div class="h-px bg-gray-700/50"></div>

              <!-- Errors & Retries sub-section -->
              <div>
                <div class="text-[9px] font-black uppercase tracking-widest text-red-400/70
                            flex items-center gap-1.5 mb-3">
                  <i class="fas fa-exclamation-circle text-red-500/60"></i> Errors &amp; Retries
                </div>
                <template x-for="[errName, errCount] in Object.entries(metrics.errors || {})" :key="errName">
                  <div class="flex justify-between text-xs mb-2">
                    <span class="text-gray-400 font-mono text-[10px]" x-text="errName"></span>
                    <span class="font-bold px-2 rounded text-[10px]"
                          :class="errCount > 0 ? 'text-red-500 bg-red-500/10 border border-red-500/20' : 'text-gray-500'"
                          x-text="errCount"></span>
                  </div>
                </template>
                <div class="h-px bg-gray-700/50 my-3"></div>
                <div class="flex justify-between text-xs mb-2">
                  <span class="text-gray-400 font-medium tracking-wide">Token Refreshes</span>
                  <span class="font-medium text-gray-200" x-text="metrics.totals ? metrics.totals.token_refreshes : 0"></span>
                </div>
                <div class="flex justify-between text-xs">
                  <span class="text-gray-400 font-medium tracking-wide">Retries (401→refresh)</span>
                  <span class="font-medium text-gray-200" x-text="metrics.totals ? metrics.totals.retries : 0"></span>
                </div>
              </div>

            </div><!-- /expandable body -->
          </div><!-- /edge detail accordion -->

        </div><!-- /RIGHT External -->

      </div><!-- /two-column grid -->

      <!-- ══ SECTION NAV — sticky button bar (scroll only, no hash mutation) ══ -->
      <div class="sticky top-0 z-20 flex items-center gap-0.5 border-b border-gray-700/60
                  bg-gray-900/95 backdrop-blur-sm py-0.5 -mx-1 px-1 mt-2">
        <button type="button"
           @click="document.getElementById('apimetrics-traces').scrollIntoView({behavior:'smooth',block:'start'})"
           class="flex items-center gap-1.5 px-4 py-2 text-xs font-black
                  text-gray-500 hover:text-emerald-300 transition border-b-2 border-transparent
                  hover:border-emerald-400">
          <i class="fas fa-table text-[10px]"></i>Raw Traces
        </button>
      </div>

      <!-- ══ BOTTOM: Wide Data Tables ══════════════════════════════════ -->
      <div class="mt-4 flex flex-col gap-4">
        
        <!-- Utility / Export Buttons -->
        <div id="apimetrics-traces" class="flex items-center justify-between">
          <div class="text-[12px] font-black uppercase tracking-widest text-gray-400/80 flex items-center gap-2">
            <i class="fas fa-table text-gray-500/60"></i> Raw Telemetry Traces
          </div>
          <div class="flex items-center gap-2">
            <button @click="exportData('csv')" class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-700/50 hover:bg-gray-700/80 text-gray-300 border border-gray-600/50 rounded-lg text-[10px] font-black uppercase tracking-wide transition-colors">
              <i class="fas fa-file-csv"></i> CSV
            </button>
            <button @click="exportData('json')" class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-700/50 hover:bg-gray-700/80 text-gray-300 border border-gray-600/50 rounded-lg text-[10px] font-black uppercase tracking-wide transition-colors">
              <i class="fas fa-file-code"></i> JSON
            </button>
          </div>
        </div>

        <!-- Double Table Grid Full Width -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">

            <!-- Library Methods table -->
            <div class="rounded-xl border border-gray-700 bg-gray-800/80 overflow-hidden shadow-xl flex flex-col h-[500px]">
              <!-- Card header + per-table filter -->
              <div class="px-5 pt-4 pb-3 border-b border-gray-700 bg-gray-800 flex-shrink-0">
                <div class="text-[10px] font-black uppercase tracking-widest text-emerald-400/80 flex items-center gap-2 mb-2">
                  <i class="fas fa-code text-emerald-500 text-[11px]"></i> Library Methods
                  <span class="text-gray-600 font-normal normal-case tracking-normal">(snake_case)</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <input type="text" x-model="methodFilter" placeholder="e.g. get_stats…"
                         id="apimetrics-method-filter"
                         class="bg-gray-900 border border-gray-700 rounded-md px-2.5 py-1
                                text-[11px] text-gray-200 w-full focus:outline-none focus:border-emerald-500/70 transition">
                  <button x-show="methodFilter" @click="methodFilter=''" class="text-gray-600 hover:text-gray-300 flex-shrink-0">
                    <i class="fas fa-times text-[10px]"></i>
                  </button>
                </div>
              </div>
              <div class="overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-xs text-left">
                  <thead class="bg-gray-800 border-b border-gray-700 text-[9px] font-black uppercase tracking-widest text-gray-500 sticky top-0 z-10">
                    <tr>
                      <th class="px-5 py-3">Python Method</th>
                      <th class="px-5 py-3 text-right">Invocations</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Empty state: python_methods is {} until container restarts with track_python_methods=True -->
                    <template x-if="!metrics.python_methods || Object.keys(metrics.python_methods).length === 0">
                      <tr>
                        <td colspan="2" class="px-5 py-6 text-center text-gray-600 text-[10px]">
                          <i class="fas fa-info-circle mr-1 text-blue-500/40"></i>
                          Tracking active — data appears after first poll cycle
                        </td>
                      </tr>
                    </template>
                    <template x-for="([ep, count], i) in filteredMethods()" :key="ep">
                      <tr class="border-b border-gray-700/30 hover:bg-gray-700/30 transition-colors" :class="i % 2 === 1 ? 'bg-gray-800/20' : ''">
                        <td class="px-5 py-3 font-mono text-[10px] text-gray-300" x-text="ep"></td>
                        <td class="px-5 py-3 text-right font-medium text-gray-100" x-text="count"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Endpoints table -->
            <div class="rounded-xl border border-gray-700 bg-gray-800/80 overflow-hidden shadow-xl flex flex-col h-[500px]">
              <!-- Card header + per-table filter -->
              <div class="px-5 pt-4 pb-3 border-b border-gray-700 bg-gray-800 flex-shrink-0">
                <div class="text-[10px] font-black uppercase tracking-widest text-blue-400/80 flex items-center gap-2 mb-2">
                  <i class="fas fa-link text-blue-500 text-[11px]"></i> Cloud API Endpoints
                  <span class="text-gray-600 font-normal normal-case tracking-normal">(camelCase)</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <input type="text" x-model="endpointFilter" placeholder="e.g. Composite…"
                         id="apimetrics-endpoint-filter"
                         class="bg-gray-900 border border-gray-700 rounded-md px-2.5 py-1
                                text-[11px] text-gray-200 w-full focus:outline-none focus:border-blue-500/70 transition">
                  <button x-show="endpointFilter" @click="endpointFilter=''" class="text-gray-600 hover:text-gray-300 flex-shrink-0">
                    <i class="fas fa-times text-[10px]"></i>
                  </button>
                </div>
              </div>
              <div class="overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-xs text-left">
                  <thead class="bg-gray-800 border-b border-gray-700 text-[9px] font-black uppercase tracking-widest text-gray-500 sticky top-0 z-10">
                    <tr>
                      <th class="px-5 py-3">Endpoint Route</th>
                      <th class="px-5 py-3 text-right">HTTPS Requests</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="([ep, count], i) in filteredEndpoints()" :key="ep">
                      <tr class="border-b border-gray-700/30 hover:bg-gray-700/30 transition-colors" :class="i % 2 === 1 ? 'bg-gray-800/20' : ''">
                        <td class="px-5 py-3 font-mono text-[10px] text-gray-300" x-text="ep"></td>
                        <td class="px-5 py-3 text-right font-medium text-gray-100" x-text="count"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

        </div>
      </div>

    </div>
  </template>

  <!-- ══ CloudFront PoP Map Modal ═══════════════════════════════════════════ -->
  <div x-show="popMapOpen" x-cloak
       @keydown.escape.window="closePopMap()"
       class="fixed inset-0 z-50 flex p-4 md:p-8"
       style="display:none">

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm cursor-pointer" @click="closePopMap()"></div>

    <!-- Modal panel: full height flex column -->
    <div class="relative z-10 flex flex-col w-full rounded-2xl bg-gray-900 border border-blue-500/20 shadow-2xl overflow-hidden">

      <!-- Modal header -->
      <div class="flex items-center gap-4 px-6 py-4 border-b border-gray-700/50 bg-gray-900 flex-shrink-0 flex-wrap">

        <!-- Title + stats -->
        <div class="flex items-center gap-2 flex-wrap flex-1 min-w-0">
          <i class="fas fa-globe text-blue-500/80 text-sm"></i>
          <span class="text-[10px] font-black uppercase tracking-widest text-blue-400/80">CloudFront PoP Distribution</span>
          <span x-show="popMapData" class="text-[10px] text-gray-500 font-mono"
                x-text="'(' + (popMapData?.total_requests || 0).toLocaleString() + ' req)'"></span>
          <span x-show="popMapDominant"
                class="text-[9px] font-mono bg-blue-900/40 text-blue-300/80 px-1.5 py-0.5 rounded border border-blue-700/30"
                x-text="'home: ' + (popMapDominant || '')" title="Most-used PoP in this period"></span>
        </div>



        <!-- Period pills -->
        <div class="flex gap-1.5 p-0.5 bg-gray-800/80 rounded-lg border border-gray-700/60">
          <template x-for="[label, days] in [['Today',1],['7d',7],['30d',30],['All',0]]" :key="days">
            <button @click="popMapPeriod = days; fetchPopMap()"
                    class="px-3 py-1.5 rounded-md text-[10px] font-black uppercase tracking-wide transition-all duration-150"
                    :class="popMapPeriod === days ? 'bg-blue-600 text-white border border-blue-500/60 shadow-sm' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-700/50'"
                    x-text="label"></button>
          </template>
        </div>

        <!-- Close -->
        <button @click="closePopMap()"
                class="p-2 rounded-lg text-gray-500 hover:text-gray-100 hover:bg-gray-700/60 transition-colors"
                title="Close (Esc)">
          <i class="fas fa-times text-base"></i>
        </button>
      </div>

      <!-- Modal body: fills remaining height -->
      <div class="flex-1 relative overflow-hidden">

        <!-- Loading -->
        <div x-show="popMapLoading"
             class="absolute inset-0 flex items-center justify-center gap-3 text-gray-400 bg-gray-900">
          <i class="fas fa-circle-notch fa-spin text-xl"></i>
          <span class="text-sm">Loading PoP data…</span>
        </div>

        <!-- No data -->
        <div x-show="!popMapLoading && (!popMapData || popMapData.total_requests === 0)"
             class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 gap-4">
          <i class="fas fa-globe text-5xl opacity-20"></i>
          <span class="text-sm">No CloudFront PoP data for this period</span>
          <span class="text-xs text-gray-700">Try a longer time window</span>
        </div>

        <!-- MAP — always fills body; transitions float on top as collapsible panel -->
        <div x-show="!popMapLoading && popMapData && popMapData.total_requests > 0"
             class="absolute inset-0 flex flex-col">
          <div id="cf-pop-map" class="flex-1" style="min-height:0"></div>
          <!-- Unknown PoP codes (bottom bar) -->
          <div x-show="popMapUnknown && popMapUnknown.length > 0"
               class="flex-shrink-0 px-5 py-2 bg-gray-900/95 border-t border-gray-700/50 flex flex-wrap gap-2 items-center">
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-500">No coords:</span>
            <template x-for="p in popMapUnknown" :key="p.code">
              <span class="text-[9px] font-mono bg-gray-800 text-gray-400 px-2 py-0.5 rounded border border-gray-700"
                    x-text="p.code + ' (' + p.count + ')'" :title="'PoP code not in coordinate lookup'"></span>
            </template>
          </div>

          <!-- Floating transitions overlay panel (bottom-LEFT corner of map) -->
          <div x-show="popMapData?.transitions?.length > 0"
               class="absolute bottom-2 left-2 w-80 flex flex-col rounded-xl border border-gray-600/70 bg-gray-900 shadow-2xl overflow-hidden"
               style="z-index:1000">

            <!-- Panel title bar — click to expand/collapse -->
            <div class="flex items-center justify-between px-3 py-2 cursor-pointer select-none border-b border-gray-700/60 hover:bg-gray-800/50 transition-colors"
                 @click="popTransitionsOpen = !popTransitionsOpen">
              <div class="flex items-center gap-1.5">
                <i class="fas fa-random text-purple-400/80 text-xs"></i>
                <span class="text-xs font-black uppercase tracking-widest text-purple-400/80">Transitions</span>
                <span class="text-[10px] font-mono bg-purple-500/30 text-purple-300 px-1.5 py-0 rounded-full"
                      x-text="popMapData?.transitions?.length"></span>
              </div>
              <i class="fas text-xs text-gray-500 transition-transform duration-200"
                 :class="popTransitionsOpen ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
            </div>

            <!-- Scrollable rows — hidden when collapsed -->
            <div x-show="popTransitionsOpen" class="overflow-y-auto" style="max-height:220px">
              <template x-for="(t, i) in (popMapData?.transitions || [])" :key="i">
                <div class="flex items-center justify-between px-3 py-2 border-b border-gray-700/40 hover:bg-gray-800/40 transition-colors">
                  <!-- From → To merged cell with per-PoP accent colour -->
                  <div class="flex items-center gap-1.5 min-w-0 flex-1">
                    <span class="text-xs font-black font-mono text-blue-300" x-text="t.from"></span>
                    <span class="text-[10px] text-gray-500">→</span>
                    <span class="text-xs font-black font-mono text-orange-300" x-text="t.to"></span>
                  </div>
                  <!-- When + Duration right-aligned -->
                  <div class="flex items-center gap-2 text-[10px] text-gray-500 flex-shrink-0 ml-2">
                    <span x-text="t.at"></span>
                    <span class="text-gray-600" x-text="t.duration !== null ? t.duration + 'm' : '—'"></span>
                  </div>
                </div>
              </template>
            </div>
          </div><!-- /transitions overlay panel -->

        </div><!-- /map wrapper -->


      </div><!-- /modal body -->
    </div><!-- /modal panel -->
  </div><!-- /PoP modal -->

</div>
