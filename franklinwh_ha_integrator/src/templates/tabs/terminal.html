<!-- ── Terminal Tab v2 ── Diagnostic Console ── -->
<div x-data="diagnosticConsole()" class="space-y-4 flex flex-col" style="min-height: calc(100vh - 200px)">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-4 flex-shrink-0">
    <div>
      <h1 class="text-xl font-black text-gray-100 flex items-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#terminal"/></svg>
        Terminal
      </h1>
      <p class="text-xs text-gray-400 mt-0.5">Diagnostic console — type "help" for commands</p>
    </div>
    <div class="flex gap-2">
      <button @click="generateSupportBundle()" :disabled="executing"
              class="flex items-center gap-2 px-3 py-2 rounded-xl border border-gray-600 bg-gray-800 text-xs font-bold text-gray-300 hover:border-primary/50 transition disabled:opacity-50">
        <i class="fas fa-download text-[10px]"></i>Support Bundle
      </button>
      <button @click="clearConsole()"
              class="flex items-center gap-2 px-3 py-2 rounded-xl border border-gray-600 bg-gray-800 text-xs font-bold text-gray-400 hover:text-gray-200 hover:border-gray-500 transition">
        <i class="fas fa-trash text-[10px]"></i>Clear
      </button>
    </div>
  </div>

  <!-- Terminal Window -->
  <div class="flex-1 min-h-0 rounded-2xl overflow-hidden shadow-2xl border border-gray-700 flex flex-col bg-[#0F172A]"
       style="min-height:400px;max-height:80vh">

    <!-- macOS-style title bar -->
    <div class="flex items-center justify-between px-4 py-3 bg-[#1E293B] border-b border-[#334155] flex-shrink-0">
      <div class="flex gap-2">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-amber-400"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
      </div>
      <div class="font-mono text-[11px] text-slate-400 tracking-widest">franklinwh-integrator — diagnostic console</div>
      <div class="font-mono text-[11px] text-slate-600"><span x-text="history.length"></span> lines</div>
    </div>

    <!-- Output area -->
    <div id="terminal-output"
         class="flex-1 overflow-y-auto p-4 font-mono text-[13px] text-slate-200 leading-relaxed whitespace-pre-wrap">
      <div class="text-slate-600 mb-4">FranklinWH HA Integrator — Native Diagnostic Console<br>Warning: Diagnostics run directly against the selected gateway.</div>
      <template x-for="(line, idx) in history" :key="idx">
        <div class="mb-0.5"
             :class="line.type === 'input' ? 'text-emerald-400 font-bold mt-3' : (line.type === 'error' ? 'text-red-400' : 'text-slate-200')">
          <template x-if="line.type === 'input'">
            <span class="text-amber-400 mr-2 select-none">$</span>
          </template>
          <span x-text="line.text"></span>
        </div>
      </template>
      <div x-show="executing" class="mt-3 text-slate-500 animate-pulse">
        <span class="text-amber-400 mr-2">$</span>executing…
      </div>
    </div>

    <!-- Quick command chips + input -->
    <div class="flex-shrink-0 bg-[#0F172A] border-t border-dashed border-[#334155]">
      <!-- Quick cmds -->
      <div class="flex items-center justify-between px-4 py-2 border-b border-[#1E293B]">
        <div class="flex gap-2 flex-wrap">
          <template x-for="cmd in ['status','metrics','diag','discover','bms','accessories']" :key="cmd">
            <button class="px-3 py-1 rounded-lg font-mono text-[11px] bg-slate-800 border border-slate-700 text-slate-300
                           hover:border-primary/60 hover:text-primary-light hover:bg-primary/5 transition disabled:opacity-40"
                    @click="currentInput = cmd; executeCommand()"
                    :disabled="executing"
                    x-text="cmd"></button>
          </template>
        </div>
        <button class="flex items-center gap-1.5 px-3 py-1 rounded-lg font-mono text-[11px] transition"
                :class="executing ? 'bg-red-500/20 border border-red-500/40 text-red-400' : 'bg-slate-800 border border-slate-700 text-slate-500 cursor-not-allowed'"
                @click="abortCommand()" :disabled="!executing">
          <i class="fas fa-stop-circle text-[10px]"></i>Ctrl-C
        </button>
      </div>
      <!-- Input row -->
      <div class="flex items-center gap-3 px-4 py-3">
        <span class="font-mono text-amber-400 font-bold text-sm select-none flex-shrink-0">$</span>
        <input type="text" x-model="currentInput"
               @keydown.enter="executeCommand()"
               :disabled="executing"
               placeholder="franklinwh command…"
               class="flex-1 bg-transparent font-mono text-sm text-emerald-300 outline-none placeholder-slate-600 border-none caret-emerald-400">
        <button @click="executeCommand()" :disabled="executing || !currentInput.trim()"
                class="px-4 py-1.5 rounded-lg bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-mono text-xs font-bold hover:bg-emerald-500/30 transition disabled:opacity-40">
          <i class="fas fa-play text-[9px] mr-1"></i>Run
        </button>
      </div>
    </div>
  </div>

</div>
<!-- diagnosticConsole() loaded from admin.html head -->
